async function api(path,body,signal){
 const controller=signal?null:new AbortController();
 const timer=controller?setTimeout(()=>controller.abort(),12000):null;
 try{
  const r=await fetch(path,{method:body?'POST':'GET',headers:{'content-type':'application/json','x-telegram-init-data':init},body:body?JSON.stringify(body):undefined,signal:signal||controller.signal});
  let d;try{d=await r.json()}catch{throw Error('Нет связи с сервисом. Расписание останется доступным.')}

 }finally{if(timer)clearTimeout(timer)}

async function getGroupSchedule(target){
 const key='dc-schedule:'+catalog.version+':'+target,cached=readJSON(key);
 if(cached?.version===catalog.version&&cached.group===target&&Array.isArray(cached.lessons))return cached;
 if(scheduleFlights.has(key))return scheduleFlights.get(key);

 });

function localDay(date){
 const d=new Date(date+'T00:00:00Z');if(!Number.isFinite(+d)||d.toISOString().slice(0,10)!==date)return {date,week:0,lessons:[]};
 const week=Math.floor((+d-+new Date(catalog.semesterStart+'T00:00:00Z'))/604800000)+1,day=(d.getUTCDay()+6)%7;
 const lessons=date<catalog.semesterStart||date>catalog.semesterEnd?[]:allLessons.filter(l=>l.day===day&&l.weeks.includes(week));
 return {date,week,lessons};
}
function showDate(date){selectedDate=date;Object.assign(data,localDay(date));render()}
function showSync(){
 const strip=document.getElementById('syncStrip');if(!strip)return;
 strip.className='sync-strip '+(remoteStatus==='error'?'sync-stale':'');
 strip.innerHTML=remoteStatus==='loading'?'<span class="tiny-spinner"></span><span>Обновляем задания…</span>':remoteStatus==='error'?'<span>'+esc(remoteError||'Задания пока не обновились. Расписание доступно.')+'</span><button class="textbtn" id="syncRetry">Повторить</button>':'';
 document.getElementById('syncRetry')?.addEventListener('click',()=>refreshRemote(true));
}
let pendingGroupSave=false;
async function refreshRemote(force=false){
 if(!data||data.offlineSession)return;
 if(data.demo){data.tasks=readJSON('dc-demo-tasks',[]).filter(t=>t.group===group);data.submissions=readJSON('dc-demo-subs',[]);render();return}
 const target=group,key=userKey()+':'+target,epoch=groupEpoch;
 const cached=remoteCache.get(key);
 if(!force&&!pendingGroupSave&&cached&&Date.now()-cached.time<60000){Object.assign(data,cached.value,localDay(selectedDate));render();return}
 if(remoteFlight?.key===key)return remoteFlight.promise;
 remoteController?.abort();const controller=new AbortController();remoteController=controller;
 remoteStatus='loading';remoteError='';showSync();
 const timeout=setTimeout(()=>controller.abort(),12000);
 const promise=(async()=>{
  try{
   const result=await api('/api/state?group='+encodeURIComponent(target),null,controller.signal);
   if(epoch!==groupEpoch||target!==group)return;
   const snapshot={profile:result.profile,tasks:result.tasks,submissions:result.submissions,syncedAt:result.syncedAt};
   Object.assign(data,snapshot,localDay(selectedDate));remoteCache.set(key,{value:snapshot,time:Date.now()});
   if(pendingGroupSave||data.profile.group!==target){
    await api('/api/profile',{group:target,reminders:data.profile.reminders==='true'},controller.signal);
    if(epoch!==groupEpoch||target!==group)return;
    data.profile.group=target;pendingGroupSave=false;
   }
   remoteStatus='';remoteError='';render();
  }catch(e){
   if(epoch!==groupEpoch||target!==group)return;
   remoteStatus='error';remoteError=e.status===401?'Открой приложение заново через Telegram, чтобы обновить задания.':'Задания пока не обновились. Расписание доступно офлайн.';
   showSync();
  }finally{clearTimeout(timeout);if(remoteFlight?.promise===promise)remoteFlight=null;}
 })();
 remoteFlight={key,promise};return promise;
}
async function activateGroup(target,{saveGroup=false,initial=false}={}){
 if(!catalog.groups.some(g=>g.id===target))return;
 const epoch=++groupEpoch;remoteController?.abort();
 pendingGroupSave=saveGroup;remoteStatus='';remoteError='';
 bootScreen('Загружаем твою группу',target+' · расписание на весь семестр');
 try{
  const bundle=await getGroupSchedule(target);
  if(epoch!==groupEpoch)return;
  group=target;allLessons=bundle.lessons;
  saveJSON(confirmedKey(),target);try{localStorage.setItem('dc-group',target)}catch{}
  const snapshot=remoteCache.get(userKey()+':'+target)?.value;
  data={...data,...catalog,group:target,profile:{group:target,reminders:'false'},tasks:[],submissions:[],...snapshot,...localDay(selectedDate)};
  mode=data.user.role==='teacher'?(localStorage.getItem('dc-mode')||'teacher'):'student';
  document.body.classList.remove('booting');document.getElementById('bootRoot').innerHTML='';render();
  if(saveGroup)pendingGroupSave=true;
  refreshRemote(false);
 }catch(e){if(epoch===groupEpoch)bootError('Не удалось загрузить расписание. '+(e.message||''),()=>activateGroup(target,{saveGroup,initial}))}
}
async function load(){return refreshRemote(true)}
async function boot(){
 bootScreen('Открываем твой колледж');
 try{
  const cachedCatalog=readJSON('dc-catalog-v2');
  const catalogPromise=api('/api/catalog').then(c=>{saveJSON('dc-catalog-v2',c);return c}).catch(e=>{if(cachedCatalog)return cachedCatalog;throw e});
  const sessionPromise=init?api('/api/session'):Promise.resolve({user:{id:'demo',name:'Демонстрация',role:'teacher'}});
  const [c,session]=await Promise.all([catalogPromise,sessionPromise.catch(e=>({user:{id:'offline',name:'Расписание офлайн',role:'student'},offlineSession:true}))]);
  catalog=c;data={...c,...session,demo:!init,profile:{group:'',reminders:'false'},tasks:[],submissions:[]};
  const saved=readJSON(confirmedKey(),'');
  if(saved&&catalog.groups.some(g=>g.id===saved))await activateGroup(saved,{initial:true});else selectGroupScreen();
 }catch(e){bootError(e.message||'Нет связи с приложением',boot)}
}

function navigate(p){page=p;render();window.scrollTo(0,0)}
function done(t){return data.submissions.some(s=>s.task_id===t.id&&s.user_id===data.user.id)}
function overdue(t){return Date.parse(t.due+':00+05:00')<Date.now()&&!done(t)}
function title(h,p){return '<h1 class="page-title">'+h+'</h1><p class="sub">'+p+'</p>'}
function groupSelect(){return '<select class="field" id="groupSelect" aria-label="Учебная группа">'+data.groups.map(g=>'<option '+(g.id===group?'selected':'')+' value="'+esc(g.id)+'">'+esc(g.id)+' · '+esc(g.course)+'</option>').join('')+'</select>'}
function notice(){return '<div class="warn">'+esc(data.status)+'. Данные из предоставленного Excel.</div>'}
function lessons(items){if(!items.length)return '<div class="empty">'+icon('calendar')+(selectedDate<data.semesterStart||selectedDate>data.semesterEnd?'Выбранная дата за пределами семестра.':'По исходному файлу на этот день занятий нет.')+'</div>';return items.map(l=>'<div class="lesson"><div class="times">'+esc(l.start)+'<small>'+esc(l.end)+'</small></div><article class="lessoncard '+(l.kind==='МЕНТОР'?'mentor':l.kind==='ПРАКТИКА'?'practice':'')+'"><div class="cardtop"><span class="badge '+(l.kind==='МЕНТОР'?'purple':l.kind==='ПРАКТИКА'?'green':'')+'">'+esc(l.kind)+'</span><span class="hint">'+l.slot+' пара</span></div><h3>'+esc(l.subject)+'</h3><div class="meta"><span>'+icon('pin')+esc(l.room)+'</span><span>'+esc(l.teacher)+'</span></div></article></div>').join('')}
function taskCard(t){const complete=done(t),late=overdue(t),count=new Set(data.submissions.filter(s=>s.task_id===t.id).map(s=>s.user_id)).size;return '<article class="task"><div class="cardtop"><span class="badge">'+esc(t.subject)+'</span><span class="badge '+(complete?'green':late?'orange':'purple')+'">'+(mode==='teacher'?count+' работ':complete?'Сдано':late?'Срок прошёл':'К сдаче')+'</span></div><h3>'+esc(t.title)+'</h3><p class="details">'+esc(t.details||'Подробности у преподавателя')+'</p><div class="taskfoot"><span class="meta">'+icon('clock')+esc(deadline(t.due))+'</span><button class="textbtn" data-task="'+esc(t.id)+'">'+(mode==='teacher'?'Открыть работы':complete?'Мой ответ':'Сдать работу')+' →</button></div></article>'}
function render(){
 document.getElementById('userName').textContent=data.user.name;document.getElementById('userRole').textContent=mode==='teacher'?'Преподаватель':'Студент';document.getElementById('avatar').textContent=data.user.name.slice(0,1);document.getElementById('topGroup').textContent=group+' · '+(data.week>=1&&data.week<=18?'Неделя '+data.week:'Вне семестра');
 for(const id of ['sideNav','bottomNav'])document.getElementById(id).innerHTML=navs.map(([p,i,t])=>'<button class="'+(page===p?'active':'')+'" data-nav="'+p+'">'+icon(i)+t+'</button>').join('');
 let html=data.demo?'<div class="demobar">Демо-просмотр вне Telegram. Задания здесь сохраняются только в этом браузере.</div>':'';html+='<div id="syncStrip" class="sync-strip" aria-live="polite"></div>';
 if(page==='today'){
 const remaining=data.tasks.filter(t=>!done(t)).length;const next=data.lessons.find(l=>selectedDate!==today||l.end>new Intl.DateTimeFormat('ru-RU',{timeZone:'Asia/Almaty',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()));
 html+=title(mode==='teacher'?'Всё готово к занятиям?':'Твой день в колледже',dayLabel(selectedDate));
 html+='<section class="hero"><div class="hero-tag">'+icon('calendar')+' '+esc(group)+'</div><h2>'+(next?esc(next.subject):'Освободи время для главного')+'</h2><p>'+(next?esc(next.start)+'–'+esc(next.end)+' · аудитория '+esc(next.room):'Занятия, дедлайны и задания — всегда под рукой.')+'</p><button class="mint" data-nav="schedule">Моё расписание →</button><div class="hero-icon">'+icon('book')+'</div></section>';
 html+='<div class="stats"><div class="stat"><span>Занятий на день</span><strong>'+data.lessons.length+'<small>по расписанию</small></strong></div><div class="stat"><span>'+(mode==='teacher'?'Заданий группе':'Ждут выполнения')+'</span><strong>'+(mode==='teacher'?data.tasks.length:remaining)+'</strong></div><div class="stat"><span>Неделя семестра</span><strong>'+(data.week>=1&&data.week<=18?data.week:'—')+'<small>из 18</small></strong></div></div>';
 html+='<div class="contentgrid"><section><div class="sectionhead"><h2>Расписание на день</h2><button class="textbtn" data-nav="schedule">Вся неделя →</button></div>'+lessons(data.lessons.slice(0,4))+'</section><section><div class="sectionhead"><h2>Ближайшие задания</h2><button class="textbtn" data-nav="tasks">Все →</button></div>'+(data.tasks.slice().sort((a,b)=>a.due.localeCompare(b.due)).slice(0,3).map(taskCard).join('')||'<div class="empty">'+icon('tasks')+'Пока нет заданий для этой группы.<br>Преподаватель может добавить первое.</div>')+'<div class="sectionhead"><h2>Скажи — бот поможет</h2></div><div class="task"><p class="sub">«Какие завтра пары?»<br>«Создай задание для моей группы до пятницы»</p><button class="textbtn" id="voice">'+icon('mic')+' Перейти к голосовому боту →</button></div></section></div>'+notice();
 }else if(page==='schedule'){
 html+=title('Твоё расписание','Занятия учитывают неделю семестра и выбранную группу.');html+='<div class="groupbar">'+groupSelect()+'<input class="field dateinput" type="date" id="datePick" aria-label="Дата занятия" value="'+selectedDate+'"></div>';
 const base=new Date(selectedDate+'T12:00:00Z');base.setUTCDate(base.getUTCDate()-(base.getUTCDay()+6)%7);html+='<div class="weeknav"><button class="arrow" id="prevWeek" aria-label="Предыдущая неделя">‹</button><div class="days">';for(let i=0;i<6;i++){const d=new Date(base);d.setUTCDate(d.getUTCDate()+i);const iso=d.toISOString().slice(0,10);html+='<button class="day '+(iso===selectedDate?'selected':'')+'" data-date="'+iso+'">'+['ПН','ВТ','СР','ЧТ','ПТ','СБ'][i]+'<b>'+d.getUTCDate()+'</b></button>'}html+='</div><button class="arrow" id="nextWeek" aria-label="Следующая неделя">›</button></div><div class="sectionhead"><h2>'+esc(dayLabel(selectedDate))+'</h2><button class="textbtn" id="goToday">Сегодня</button></div>'+lessons(data.lessons)+notice()+'<p class="hint source">Источник: '+esc(data.sourceName)+'<br>Семестр: 31.08.2026–01.01.2027. Неоднозначные данные преподавателей отмечены для уточнения.</p>';
 }else if(page==='tasks'){
 html+=title('Задания группы',mode==='teacher'?'Создавай задания и просматривай ответы студентов.':'Всё, что нужно подготовить к следующим занятиям.');
 html+='<div class="groupbar">'+groupSelect()+(mode==='teacher'?'<button class="primary" id="newTask">'+icon('plus')+' Задание</button>':'')+'</div><div class="pills">'+[['all','Все'],['open','К сдаче'],['done','Сдано']].map(([id,label])=>'<button class="pill '+(filter===id?'active':'')+'" data-filter="'+id+'">'+label+'</button>').join('')+'</div>';
 const tasks=data.tasks.filter(t=>filter==='all'||(filter==='done'?done(t):!done(t)));html+=tasks.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(taskCard).join('')||'<div class="empty">'+icon('tasks')+'Здесь пока пусто.<br>'+(mode==='teacher'?'Создай первое задание для группы.':'Когда преподаватель добавит задание, оно появится здесь.')+'</div>';
 }else{
 html+=title('Твой профиль','Выбери группу, чтобы расписание и задания были рядом.');
 html+='<form class="profilecard" id="profileForm"><div class="formrow"><label>Учебная группа</label>'+groupSelect()+'</div><label class="toggle"><input type="checkbox" id="reminders" '+(data.profile.reminders==='true'?'checked':'')+'>Напоминать в Telegram о заданиях, до сдачи которых осталось меньше суток</label><p class="hint">Для уведомлений сначала отправьте /start боту. Уведомление приходит один раз на задание.</p><button class="primary" type="submit">Сохранить настройки</button></form>';
 if(data.user.role==='teacher')html+='<div class="profilecard"><h3 style="margin:0 0 8px;font-size:15px">Режим презентации</h3><p class="sub">Посмотри интерфейс с точки зрения преподавателя или студента.</p><div class="pills"><button class="pill '+(mode==='teacher'?'active':'')+'" data-mode="teacher">Преподаватель</button><button class="pill '+(mode==='student'?'active':'')+'" data-mode="student">Студент</button></div><p class="hint">Переключатель меняет интерфейс. Права доступа задаются на сервере по Telegram ID.</p></div>';
 html+='<div class="profilecard"><div class="brand"><div class="logo">d.</div><div>Digital College<b>УЧЕБНЫЙ ПОМОЩНИК</b></div></div><p class="hint source">'+esc(data.status)+'<br>Источник: '+esc(data.sourceName)+'</p></div>';
 }
 document.getElementById('content').innerHTML=html;bind();showSync();
}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;localStorage.setItem('dc-mode',mode);render()});document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>showDate(b.dataset.date));document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>taskModal(b.dataset.task));
 const gs=document.getElementById('groupSelect');if(gs&&page!=='profile')gs.onchange=()=>activateGroup(gs.value,{saveGroup:true});const dp=document.getElementById('datePick');if(dp)dp.onchange=()=>{if(dp.value)showDate(dp.value)};
 for(const [id,n] of [['prevWeek',-7],['nextWeek',7]]){const b=document.getElementById(id);if(b)b.onclick=()=>{const d=new Date(selectedDate+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);showDate(d.toISOString().slice(0,10))}}
 document.getElementById('goToday')?.addEventListener('click',()=>showDate(today));document.getElementById('newTask')?.addEventListener('click',newTaskModal);
 document.getElementById('voice')?.addEventListener('click',()=>{if(init){tg.close()}else window.open('https://t.me/AccountantBookkeeperBot','_blank','noopener')});
 document.getElementById('profileForm')?.addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button[type=submit]');button.disabled=true;try{const target=document.getElementById('groupSelect').value;const reminders=document.getElementById('reminders').checked;if(!data.demo)await api('/api/profile',{group:target,reminders});data.profile={group:target,reminders:String(reminders)};toast('Настройки сохранены');if(target!==group)await activateGroup(target);else await refreshRemote(true)}catch(e){toast(e.message)}finally{button.disabled=false}});
}
function modal(title,body){document.getElementById('modalRoot').innerHTML='<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="modalhead"><h2>'+esc(title)+'</h2><button class="close" aria-label="Закрыть">×</button></div>'+body+'</section></div>';document.querySelector('.close').onclick=closeModal;document.querySelector('.modalback').onclick=e=>{if(e.target.className==='modalback')closeModal()};document.querySelector('.modal input,.modal textarea,.modal button')?.focus()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function newTaskModal(){const d=new Date(today+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+1);modal('Новое задание','<form id="taskForm"><p class="hint">Группа '+esc(group)+'</p><div class="formrow"><label for="subject">Предмет</label><input class="field" id="subject" required maxlength="120" placeholder="Например, программирование"></div><div class="formrow"><label for="taskTitle">Название</label><input class="field" id="taskTitle" required maxlength="200" placeholder="Практическая работа №3"></div><div class="formrow"><label for="taskDetails">Что нужно сделать</label><textarea class="field" id="taskDetails" maxlength="5000" placeholder="Инструкция, материалы и требования к работе"></textarea></div><div class="formrow"><label for="taskDue">Срок сдачи · Алматы (UTC+5)</label><input class="field" id="taskDue" type="datetime-local" required value="'+d.toISOString().slice(0,10)+'T18:00"></div><button class="primary" type="submit">Создать задание</button></form>');document.getElementById('taskForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;try{const b={group,subject:document.getElementById('subject').value,title:document.getElementById('taskTitle').value,details:document.getElementById('taskDetails').value,due:document.getElementById('taskDue').value,request_id:crypto.randomUUID()};if(data.demo){const all=JSON.parse(localStorage.getItem('dc-demo-tasks')||'[]');all.push({...b,id:b.request_id,teacher_name:'Демонстрация'});localStorage.setItem('dc-demo-tasks',JSON.stringify(all))}else await api('/api/tasks',b);closeModal();toast('Задание добавлено для группы');await load()}catch(e){toast(e.message);btn.disabled=false}}}
function taskModal(id){const t=data.tasks.find(t=>t.id===id);if(!t)return;const subs=data.submissions.filter(s=>s.task_id===id);let body='<p class="hint">'+esc(t.subject)+' · до '+esc(deadline(t.due))+'</p><p class="sub" style="white-space:pre-wrap">'+esc(t.details)+'</p>';
 if(mode==='teacher'){const latest=[...new Map(subs.map(s=>[s.user_id,s])).values()];body+='<div class="sectionhead"><h2>Работы · '+latest.length+'</h2></div>'+(latest.map(s=>'<div class="submitcard"><strong>'+esc(s.name)+'</strong><br>'+esc(s.answer)+(s.link?'<br><a href="'+esc(s.link)+'" target="_blank" rel="noopener noreferrer">Открыть работу ↗</a>':'')+'</div>').join('')||'<div class="empty">Ответов пока нет</div>');modal(t.title,body);return}
 const mine=subs.filter(s=>s.user_id===data.user.id).at(-1);body+='<form id="submitForm"><div class="formrow"><label for="answer">Твой ответ</label><textarea class="field" id="answer" maxlength="5000" placeholder="Напиши ответ или добавь ссылку ниже">'+esc(mine?.answer||'')+'</textarea></div><div class="formrow"><label for="workLink">Ссылка на работу</label><input class="field" id="workLink" type="url" placeholder="https://…" value="'+esc(mine?.link||'')+'"></div><p class="hint">Зарегистрируй группу в профиле перед первой сдачей. Файлы можно передать ссылкой из Google Drive.</p><button class="primary" type="submit">Отправить преподавателю</button></form>';modal(t.title,body);
 document.getElementById('submitForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{const b={task_id:id,answer:document.getElementById('answer').value,link:document.getElementById('workLink').value};if(!b.answer.trim()&&!b.link.trim())throw Error('Добавь ответ или ссылку');if(b.link&&!/^https:\/\//i.test(b.link))throw Error('Используй ссылку https://');if(data.demo){data.submissions.push({...b,user_id:data.user.id,name:'Демонстрация'});localStorage.setItem('dc-demo-subs',JSON.stringify(data.submissions))}else await api('/api/submit',b);closeModal();toast('Работа отправлена');await load()}catch(e){toast(e.message);btn.disabled=false}};
}
boot();
