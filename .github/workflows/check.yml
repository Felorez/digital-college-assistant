name: Check code
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r telegram-bot/requirements.txt
      - run: python -m unittest discover -s telegram-bot -v
  miniapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
        working-directory: miniapp
      - run: npm test
        working-directory: miniapp
